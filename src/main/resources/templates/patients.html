<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Patient Management</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f6fa;
        }

        .header {
            background: #1e3a5f;
            color: white;
            padding: 20px 30px;
        }

        .container {
            padding: 30px;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .add-button {
            background: #27ae60;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 5px;
        }

        .search-box {
            margin-bottom: 25px;
        }

        .search-box input {
            padding: 10px;
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .search-button {
            padding: 10px 20px;
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #1e3a5f;
            color: white;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

        .action {
            text-decoration: none;
            margin-right: 10px;
        }

        .view {
            color: #2980b9;
        }

        .edit {
            color: #27ae60;
        }

        .delete {
            color: #c0392b;
        }

    </style>

</head>

<body>

<div class="header">

    <h1>Hospital Management System</h1>

</div>


<div class="container">

    <div class="top-section">

        <h2>Patient Management</h2>

        <a href="/patients/add"
           class="add-button">
            + Add Patient
        </a>

    </div>


    <!-- Search -->

    <div class="search-box">

        <form action="/patients"
              method="get">

            <input type="text"
                   name="search"
                   placeholder="Search patient name"
                   th:value="${search}">

            <button type="submit"
                    class="search-button">
                Search
            </button>

        </form>

    </div>


    <!-- Patient Table -->

    <table>

        <thead>

        <tr>

            <th>ID</th>

            <th>Name</th>

            <th>Phone</th>

            <th>Gender</th>

            <th>Actions</th>

        </tr>

        </thead>


        <tbody>

        <tr th:each="patient : ${patients}">

            <td th:text="${patient.id}">
                1
            </td>

            <!-- FIXED: Patient has firstName and lastName, not name -->

            <td th:text="${patient.firstName + ' ' + patient.lastName}">
                John Doe
            </td>

            <td th:text="${patient.phone}">
                0771234567
            </td>

            <td th:text="${patient.gender}">
                Male
            </td>

            <td>

                <a th:href="@{/patients/view/{id}(id=${patient.id})}"
                   class="action view">
                    View
                </a>

                <a th:href="@{/patients/edit/{id}(id=${patient.id})}"
                   class="action edit">
                    Edit
                </a>

                <a th:href="@{/patients/delete/{id}(id=${patient.id})}"
                   class="action delete"
                   onclick="return confirm('Are you sure you want to delete this patient?');">
                    Delete
                </a>

            </td>

        </tr>


        <!-- No patients -->

        <tr th:if="${#lists.isEmpty(patients)}">

            <td colspan="5"
                style="text-align:center;">

                No patients found.

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
