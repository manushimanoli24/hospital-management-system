<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Add Doctor</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f6fa;
        }

        .header {
            background: #1e3a5f;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 80%;
            max-width: 700px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input:focus {
            border-color: #2563eb;
            outline: none;
        }

        .error {
            color: #dc2626;
            font-size: 14px;
            margin-top: 5px;
            display: block;
        }

        button {
            padding: 12px 20px;
            background: #1e3a5f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #162d4a;
        }

        .back {
            display: inline-block;
            margin-top: 15px;
            color: #2563eb;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="header">

    <h1>➕ Add Doctor</h1>

</div>


<div class="container">

    <div class="card">

        <form th:action="@{/doctors/add}"
              th:object="${doctor}"
              method="post"
              onsubmit="return validateDoctorForm()">


            <!-- First Name -->

            <div class="form-group">

                <label>First Name</label>

                <input
                        type="text"
                        th:field="*{firstName}"
                        required
                        maxlength="50"
                        pattern="[A-Za-z ]+"
                        title="First name must contain letters only">

                <span
                        class="error"
                        th:if="${#fields.hasErrors('firstName')}"
                        th:errors="*{firstName}">
                </span>

            </div>


            <!-- Last Name -->

            <div class="form-group">

                <label>Last Name</label>

                <input
                        type="text"
                        th:field="*{lastName}"
                        required
                        maxlength="50"
                        pattern="[A-Za-z ]+"
                        title="Last name must contain letters only">

                <span
                        class="error"
                        th:if="${#fields.hasErrors('lastName')}"
                        th:errors="*{lastName}">
                </span>

            </div>


            <!-- Specialization -->

            <div class="form-group">

                <label>Specialization</label>

                <input
                        type="text"
                        th:field="*{specialization}"
                        required
                        maxlength="100">

                <span
                        class="error"
                        th:if="${#fields.hasErrors('specialization')}"
                        th:errors="*{specialization}">
                </span>

            </div>


            <!-- Phone -->

            <div class="form-group">

                <label>Phone</label>

                <input
                        type="tel"
                        th:field="*{phone}"
                        required
                        pattern="[0-9]{10}"
                        maxlength="10"
                        minlength="10"
                        title="Phone number must contain exactly 10 digits">

                <span
                        class="error"
                        th:if="${#fields.hasErrors('phone')}"
                        th:errors="*{phone}">
                </span>

            </div>


            <!-- Email -->

            <div class="form-group">

                <label>Email</label>

                <input
                        type="email"
                        th:field="*{email}"
                        required
                        maxlength="100"
                        placeholder="example@gmail.com">

                <span
                        class="error"
                        th:if="${#fields.hasErrors('email')}"
                        th:errors="*{email}">
                </span>

            </div>


            <!-- Department -->

            <div class="form-group">

                <label>Department</label>

                <input
                        type="text"
                        th:field="*{department}"
                        required
                        maxlength="100">

                <span
                        class="error"
                        th:if="${#fields.hasErrors('department')}"
                        th:errors="*{department}">
                </span>

            </div>


            <!-- Schedule -->

            <div class="form-group">

                <label>Schedule</label>

                <input
                        type="text"
                        th:field="*{schedule}"
                        required
                        maxlength="150"
                        placeholder="Monday - Friday, 8:00 AM - 4:00 PM">

                <span
                        class="error"
                        th:if="${#fields.hasErrors('schedule')}"
                        th:errors="*{schedule}">
                </span>

            </div>


            <!-- Save -->

            <button type="submit">

                💾 Save Doctor

            </button>

        </form>


        <a href="/doctors" class="back">

            ← Back to Doctors

        </a>

    </div>

</div>


<script>

    function validateDoctorForm() {

        const phone = document.getElementById("phone").value;

        const firstName = document.getElementById("firstName").value;
        const lastName = document.getElementById("lastName").value;

        const namePattern = /^[A-Za-z ]+$/;
        const phonePattern = /^[0-9]{10}$/;

        if (!namePattern.test(firstName)) {
            alert("First name must contain letters only.");
            return false;
        }

        if (!namePattern.test(lastName)) {
            alert("Last name must contain letters only.");
            return false;
        }

        if (!phonePattern.test(phone)) {
            alert("Phone number must contain exactly 10 digits.");
            return false;
        }

        return true;
    }

</script>

</body>

</html>
