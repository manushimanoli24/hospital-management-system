<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Patient Reports</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 40px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #333;
        }

        .back-btn {
            text-decoration: none;
            background-color: #555;
            color: white;
            padding: 10px 18px;
            border-radius: 5px;
        }

        .back-btn:hover {
            background-color: #333;
        }

        .report-box {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .report-box h2 {
            color: #555;
            margin-bottom: 15px;
        }

        .number {
            font-size: 45px;
            font-weight: bold;
            color: #1e3a5f;
            margin-bottom: 10px;
        }

        .description {
            color: #777;
            font-size: 16px;
        }

    </style>

</head>

<body>

<div class="container">


    <!-- Header -->

    <div class="header">

        <h1>Patient Reports</h1>

        <a href="/reports" class="back-btn">
            Back to Reports
        </a>

    </div>


    <!-- Patient Report -->

    <div class="report-box">

        <h2>Total Patients</h2>

        <div class="number"
             th:text="${totalPatients}">
            0
        </div>

        <div class="description">
            Total number of registered patients in the hospital.
        </div>

    </div>


</div>

</body>

</html>
