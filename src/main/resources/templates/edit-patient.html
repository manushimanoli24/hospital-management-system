<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Patient - Hospital Management System</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f6fa;
        }

        .header {
            background: #1e3a5f;
            color: white;
            padding: 20px 30px;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        h2 {
            color: #1e3a5f;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #219150;
        }

        .back {
            margin-left: 10px;
            text-decoration: none;
            color: #1e3a5f;
        }

        /* Validation error message */
        .error {
            color: #d32f2f;
            font-size: 13px;
            margin-top: 5px;
            display: block;
        }

        /* Highlight invalid fields */
        .input-error {
            border: 1px solid #d32f2f;
        }

        /* Validation summary */
        .error-summary {
            background: #ffe6e6;
            border: 1px solid #d32f2f;
            color: #b71c1c;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

    </style>

</head>

<body>

<div class="header">

    <h1>Hospital Management System</h1>

</div>


<div class="container">

    <h2>Edit Patient</h2>


    <!-- Validation Summary -->
    <div class="error-summary"
         th:if="${#fields.hasAnyErrors()}">

        Please correct the errors below before updating the patient.

    </div>


    <form th:action="@{/patients/edit/{id}(id=${patient.id})}"
          th:object="${patient}"
          method="post">


        <!-- First Name -->
        <div class="form-group">

            <label for="firstName">
                First Name
            </label>

            <input type="text"
                   id="firstName"
                   th:field="*{firstName}"
                   th:classappend="${#fields.hasErrors('firstName')} ? 'input-error' : ''">

            <span class="error"
                  th:if="${#fields.hasErrors('firstName')}"
                  th:errors="*{firstName}">
            </span>

        </div>


        <!-- Last Name -->
        <div class="form-group">

            <label for="lastName">
                Last Name
            </label>

            <input type="text"
                   id="lastName"
                   th:field="*{lastName}"
                   th:classappend="${#fields.hasErrors('lastName')} ? 'input-error' : ''">

            <span class="error"
                  th:if="${#fields.hasErrors('lastName')}"
                  th:errors="*{lastName}">
            </span>

        </div>


        <!-- Phone -->
        <div class="form-group">

            <label for="phone">
                Phone
            </label>

            <input type="text"
                   id="phone"
                   th:field="*{phone}"
                   th:classappend="${#fields.hasErrors('phone')} ? 'input-error' : ''">

            <span class="error"
                  th:if="${#fields.hasErrors('phone')}"
                  th:errors="*{phone}">
            </span>

        </div>


        <!-- Gender -->
        <div class="form-group">

            <label for="gender">
                Gender
            </label>

            <select id="gender"
                    th:field="*{gender}"
                    th:classappend="${#fields.hasErrors('gender')} ? 'input-error' : ''">

                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>

            </select>

            <span class="error"
                  th:if="${#fields.hasErrors('gender')}"
                  th:errors="*{gender}">
            </span>

        </div>


        <!-- Date of Birth -->
        <div class="form-group">

            <label for="dateOfBirth">
                Date of Birth
            </label>

            <input type="date"
                   id="dateOfBirth"
                   th:field="*{dateOfBirth}"
                   th:classappend="${#fields.hasErrors('dateOfBirth')} ? 'input-error' : ''">

            <span class="error"
                  th:if="${#fields.hasErrors('dateOfBirth')}"
                  th:errors="*{dateOfBirth}">
            </span>

        </div>


        <!-- Address -->
        <div class="form-group">

            <label for="address">
                Address
            </label>

            <input type="text"
                   id="address"
                   th:field="*{address}"
                   th:classappend="${#fields.hasErrors('address')} ? 'input-error' : ''">

            <span class="error"
                  th:if="${#fields.hasErrors('address')}"
                  th:errors="*{address}">
            </span>

        </div>


        <!-- Email -->
        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input type="email"
                   id="email"
                   th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? 'input-error' : ''">

            <span class="error"
                  th:if="${#fields.hasErrors('email')}"
                  th:errors="*{email}">
            </span>

        </div>


        <!-- Medical History -->
        <div class="form-group">

            <label for="medicalHistory">
                Medical History
            </label>

            <textarea id="medicalHistory"
                      th:field="*{medicalHistory}"
                      th:classappend="${#fields.hasErrors('medicalHistory')} ? 'input-error' : ''"></textarea>

            <span class="error"
                  th:if="${#fields.hasErrors('medicalHistory')}"
                  th:errors="*{medicalHistory}">
            </span>

        </div>


        <!-- Buttons -->
        <button type="submit">
            Update Patient
        </button>

        <a href="/patients"
           class="back">
            Cancel
        </a>

    </form>

</div>

</body>

</html>
