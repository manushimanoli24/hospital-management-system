<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Patient</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f6fa;
        }

        .header {
            background: #1e3a5f;
            color: white;
            padding: 20px 30px;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
        }

        button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        .back {
            margin-left: 10px;
            text-decoration: none;
            color: #1e3a5f;
        }

    </style>

</head>

<body>

<div class="header">

    <h1>Hospital Management System</h1>

</div>


<div class="container">

    <h2>Edit Patient</h2>


    <form th:action="@{/patients/edit/{id}(id=${patient.id})}"
          th:object="${patient}"
          method="post">


        <div class="form-group">

            <label>Patient Name</label>

            <input type="text"
                   th:field="*{name}"
                   required>

        </div>


        <div class="form-group">

            <label>Phone</label>

            <input type="text"
                   th:field="*{phone}"
                   required>

        </div>


        <div class="form-group">

            <label>Gender</label>

            <select th:field="*{gender}"
                    required>

                <option value="Male">Male</option>

                <option value="Female">Female</option>

                <option value="Other">Other</option>

            </select>

        </div>


        <div class="form-group">

            <label>Date of Birth</label>

            <input type="date"
                   th:field="*{dateOfBirth}">

        </div>


        <div class="form-group">

            <label>Address</label>

            <input type="text"
                   th:field="*{address}">

        </div>


        <div class="form-group">

            <label>Email</label>

            <input type="email"
                   th:field="*{email}">

        </div>


        <div class="form-group">

            <label>Medical History</label>

            <textarea th:field="*{medicalHistory}"></textarea>

        </div>


        <button type="submit">
            Update Patient
        </button>

        <a href="/patients"
           class="back">
            Cancel
        </a>

    </form>

</div>

</body>

</html>
