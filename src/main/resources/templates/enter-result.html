<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Enter Laboratory Result</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 40px;
        }

        .container {
            width: 600px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .details {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Enter Laboratory Result</h1>

    <div class="details">

        <p>
            <strong>Test Name:</strong>

            <span th:text="${laboratoryTest.testName}">
                Test
            </span>
        </p>

        <p>
            <strong>Sample:</strong>

            <span th:text="${laboratoryTest.sample}">
                Sample
            </span>
        </p>

        <p>
            <strong>Date:</strong>

            <span th:text="${laboratoryTest.testDate}">
                Date
            </span>
        </p>

    </div>


    <form
        th:action="@{/laboratory/result/{id}(id=${laboratoryTest.id})}"
        method="post">

        <label for="result">
            Laboratory Result
        </label>

        <textarea
            id="result"
            name="result"
            placeholder="Enter the laboratory test result..."
            required
            th:text="${laboratoryTest.result}">
        </textarea>


        <button type="submit">
            Save Result
        </button>

    </form>

</div>

</body>

</html>
