<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Staff Reports</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            padding: 40px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #1e3a5f;
        }

        .back-button {
            background-color: #555;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 5px;
        }

        .reports {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #555;
            margin-bottom: 20px;
        }

        .number {
            font-size: 40px;
            font-weight: bold;
            color: #1e3a5f;
        }

        .list {
            margin-top: 10px;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .name {
            font-weight: bold;
            color: #333;
        }

        .count {
            font-weight: bold;
            color: #1e3a5f;
            font-size: 18px;
        }

        .no-data {
            color: #777;
            margin-top: 10px;
        }


        @media (max-width: 768px) {

            .reports {
                grid-template-columns: 1fr;
            }

            body {
                padding: 20px;
            }

        }

    </style>

</head>


<body>

<div class="container">


    <!-- ============================== -->
    <!-- Header -->
    <!-- ============================== -->

    <div class="header">

        <h1>Staff Reports</h1>

        <a href="/reports"
           class="back-button">

            Back to Reports

        </a>

    </div>


    <!-- ============================== -->
    <!-- Report Cards -->
    <!-- ============================== -->

    <div class="reports">


        <!-- ============================== -->
        <!-- Total Employees -->
        <!-- ============================== -->

        <div class="card">

            <h2>Total Employees</h2>

            <div class="number"
                 th:text="${totalEmployees}">

                0

            </div>

        </div>


        <!-- ============================== -->
        <!-- Employees by Position -->
        <!-- ============================== -->

        <div class="card">

            <h2>Employees by Position</h2>

            <div class="list">

                <div class="list-item"
                     th:each="entry : ${employeesByPosition}">

                    <span class="name"
                          th:text="${entry.key}">

                        Position

                    </span>

                    <span class="count"
                          th:text="${entry.value}">

                        0

                    </span>

                </div>


                <div class="no-data"
                     th:if="${employeesByPosition.isEmpty()}">

                    No position data available.

                </div>

            </div>

        </div>


        <!-- ============================== -->
        <!-- Employees by Department -->
        <!-- ============================== -->

        <div class="card">

            <h2>Employees by Department</h2>

            <div class="list">

                <div class="list-item"
                     th:each="entry : ${employeesByDepartment}">

                    <span class="name"
                          th:text="${entry.key}">

                        Department

                    </span>

                    <span class="count"
                          th:text="${entry.value}">

                        0

                    </span>

                </div>


                <div class="no-data"
                     th:if="${employeesByDepartment.isEmpty()}">

                    No department data available.

                </div>

            </div>

        </div>


    </div>

</div>

</body>

</html>
