<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Staff Management</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 40px;
        }

        .container {
            width: 95%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .add-button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        .edit {
            background-color: #ffc107;
            color: black;
            padding: 6px 10px;
            text-decoration: none;
            border-radius: 4px;
        }

        .delete {
            background-color: #dc3545;
            color: white;
            padding: 6px 10px;
            text-decoration: none;
            border-radius: 4px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Staff Management</h1>

        <a class="add-button"
           href="/employees/add">
            Register Employee
        </a>

    </div>


    <table>

        <thead>

        <tr>

            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Position</th>
            <th>Department</th>
            <th>Attendance</th>
            <th>Leave</th>
            <th>Actions</th>

        </tr>

        </thead>


        <tbody>

        <tr th:each="employee : ${employees}">

            <td th:text="${employee.id}"></td>

            <td th:text="${employee.firstName}"></td>

            <td th:text="${employee.lastName}"></td>

            <td th:text="${employee.email}"></td>

            <td th:text="${employee.phone}"></td>

            <td th:text="${employee.position}"></td>

            <td th:text="${employee.department != null ?
                employee.department.name : 'Not Assigned'}">
            </td>

            <!-- Attendance -->

            <td th:text="${employee.attendance != null ?
                employee.attendance : 'Not Marked'}">
            </td>

            <!-- Leave -->

            <td th:text="${employee.leave != null ?
                employee.leave : 'No Leave'}">
            </td>

            <td>

                <a class="edit"
                   th:href="@{/employees/edit/{id}(id=${employee.id})}">
                    Edit
                </a>

                <a class="delete"
                   th:href="@{/employees/delete/{id}(id=${employee.id})}"
                   onclick="return confirm('Are you sure you want to delete this employee?');">
                    Delete
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
