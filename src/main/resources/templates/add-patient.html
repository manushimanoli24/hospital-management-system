<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Patient - Hospital Management System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f6fa;
        }

        .header {
            background: #1e3a5f;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 80%;
            max-width: 800px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #1e3a5f;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .buttons {
            margin-top: 25px;
        }

        .save-btn {
            background: #1e3a5f;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        .save-btn:hover {
            background: #16304f;
        }

        .cancel-btn {
            display: inline-block;
            margin-left: 10px;
            padding: 12px 25px;
            background: #777;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .required {
            color: red;
        }

        .error {
            color: #d32f2f;
            font-size: 13px;
            margin-top: 5px;
            display: block;
        }

        .input-error {
            border: 1px solid #d32f2f;
        }

        .error-summary {
            background: #ffe6e6;
            border: 1px solid #d32f2f;
            color: #b71c1c;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Hospital Management System</h1>
</div>

<div class="container">

    <div class="card">

        <h2>Add New Patient</h2>

        <form th:action="@{/patients/add}"
              th:object="${patient}"
              method="post">

            <!-- Validation Summary -->
            <div class="error-summary"
                 th:if="${#fields.hasAnyErrors()}">

                Please correct the errors below before saving the patient.

            </div>

            <!-- First Name -->
            <div class="form-group">

                <label for="firstName">
                    First Name <span class="required">*</span>
                </label>

                <input type="text"
                       id="firstName"
                       th:field="*{firstName}"
                       th:classappend="${#fields.hasErrors('firstName')} ? 'input-error' : ''"
                       placeholder="Enter first name">

                <span class="error"
                      th:if="${#fields.hasErrors('firstName')}"
                      th:errors="*{firstName}">
                </span>

            </div>

            <!-- Last Name -->
            <div class="form-group">

                <label for="lastName">
                    Last Name <span class="required">*</span>
                </label>

                <input type="text"
                       id="lastName"
                       th:field="*{lastName}"
                       th:classappend="${#fields.hasErrors('lastName')} ? 'input-error' : ''"
                       placeholder="Enter last name">

                <span class="error"
                      th:if="${#fields.hasErrors('lastName')}"
                      th:errors="*{lastName}">
                </span>

            </div>

            <!-- Date of Birth -->
            <div class="form-group">

                <label for="dateOfBirth">
                    Date of Birth
                </label>

                <input type="date"
                       id="dateOfBirth"
                       th:field="*{dateOfBirth}"
                       th:classappend="${#fields.hasErrors('dateOfBirth')} ? 'input-error' : ''">

                <span class="error"
                      th:if="${#fields.hasErrors('dateOfBirth')}"
                      th:errors="*{dateOfBirth}">
                </span>

            </div>

            <!-- Gender -->
            <div class="form-group">

                <label for="gender">
                    Gender
                </label>

                <select id="gender"
                        th:field="*{gender}"
                        th:classappend="${#fields.hasErrors('gender')} ? 'input-error' : ''">

                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>

                </select>

                <span class="error"
                      th:if="${#fields.hasErrors('gender')}"
                      th:errors="*{gender}">
                </span>

            </div>

            <!-- Phone -->
            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input type="text"
                       id="phone"
                       th:field="*{phone}"
                       th:classappend="${#fields.hasErrors('phone')} ? 'input-error' : ''"
                       placeholder="Enter phone number">

                <span class="error"
                      th:if="${#fields.hasErrors('phone')}"
                      th:errors="*{phone}">
                </span>

            </div>

            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input type="email"
                       id="email"
                       th:field="*{email}"
                       th:classappend="${#fields.hasErrors('email')} ? 'input-error' : ''"
                       placeholder="Enter email address">

                <span class="error"
                      th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}">
                </span>

            </div>

            <!-- Address -->
            <div class="form-group">

                <label for="address">
                    Address
                </label>

                <textarea id="address"
                          th:field="*{address}"
                          th:classappend="${#fields.hasErrors('address')} ? 'input-error' : ''"
                          placeholder="Enter patient's address"></textarea>

                <span class="error"
                      th:if="${#fields.hasErrors('address')}"
                      th:errors="*{address}">
                </span>

            </div>

            <!-- Medical History -->
            <div class="form-group">

                <label for="medicalHistory">
                    Medical History
                </label>

                <textarea id="medicalHistory"
                          th:field="*{medicalHistory}"
                          th:classappend="${#fields.hasErrors('medicalHistory')} ? 'input-error' : ''"
                          placeholder="Enter patient's medical history"></textarea>

                <span class="error"
                      th:if="${#fields.hasErrors('medicalHistory')}"
                      th:errors="*{medicalHistory}">
                </span>

            </div>

            <!-- Buttons -->
            <div class="buttons">

                <button type="submit" class="save-btn">
                    Save Patient
                </button>

                <a href="/patients" class="cancel-btn">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
