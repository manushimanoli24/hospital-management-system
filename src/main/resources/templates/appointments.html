<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Appointment Management</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
        }

        .add-button {
            background-color: #2563eb;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 5px;
        }

        table {
            width: 100%;
            margin-top: 30px;
            background-color: white;
            border-collapse: collapse;
        }

        th {
            background-color: #2563eb;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        button {
            padding: 7px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 2px;
        }

        .view {
            background-color: #16a34a;
            color: white;
        }

        .reschedule {
            background-color: #f59e0b;
            color: white;
        }

        .cancel {
            background-color: #dc2626;
            color: white;
        }

    </style>

</head>

<body>

<div class="header">

    <h1>Appointment Management</h1>

    <a href="/appointments/add" class="add-button">
        + Add Appointment
    </a>

</div>


<table>

    <thead>

    <tr>

        <th>Patient</th>
        <th>Doctor</th>
        <th>Department</th>
        <th>Date</th>
        <th>Time</th>
        <th>Status</th>
        <th>Actions</th>

    </tr>

    </thead>


    <tbody>

    <tr th:each="appointment : ${appointments}">

        <td th:text="${appointment.patientId}">
            Patient
        </td>

        <td th:text="${appointment.doctorId}">
            Doctor
        </td>

        <td th:text="${appointment.departmentId}">
            Department
        </td>

        <td th:text="${appointment.appointmentDate}">
            Date
        </td>

        <td th:text="${appointment.appointmentTime}">
            Time
        </td>

        <td th:text="${appointment.status}">
            Status
        </td>

        <td>

            <!-- View -->
            <button type="button" class="view">
                View
            </button>


            <!-- Reschedule -->
            <button type="button" class="reschedule">
                Reschedule
            </button>


            <!-- Cancel -->
            <form
                th:action="@{/appointments/cancel/{id}(id=${appointment.id})}"
                method="post"
                style="display:inline;">

                <button
                    type="submit"
                    class="cancel">

                    Cancel

                </button>

            </form>

        </td>

    </tr>

    </tbody>

</table>

</body>

</html>
