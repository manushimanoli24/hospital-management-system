<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Add Medicine</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 40px;
        }

        .container {
            width: 500px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 80px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        .error {
            color: #dc2626;
            font-size: 14px;
            margin-top: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .back-button {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #2563eb;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Add Medicine</h1>

    <form
        th:action="@{/pharmacy/save}"
        th:object="${medicine}"
        method="post">

        <!-- Medicine Name -->

        <label>
            Medicine Name
        </label>

        <input
            type="text"
            th:field="*{name}"
            minlength="2"
            maxlength="100"
            required>

        <div
            class="error"
            th:if="${#fields.hasErrors('name')}"
            th:errors="*{name}">
        </div>


        <!-- Description -->

        <label>
            Description
        </label>

        <textarea
            th:field="*{description}"
            maxlength="500">
        </textarea>

        <div
            class="error"
            th:if="${#fields.hasErrors('description')}"
            th:errors="*{description}">
        </div>


        <!-- Category -->

        <label>
            Category
        </label>

        <input
            type="text"
            th:field="*{category}"
            minlength="2"
            maxlength="100"
            required>

        <div
            class="error"
            th:if="${#fields.hasErrors('category')}"
            th:errors="*{category}">
        </div>


        <!-- Stock -->

        <label>
            Stock
        </label>

        <input
            type="number"
            th:field="*{stock}"
            min="0"
            required>

        <div
            class="error"
            th:if="${#fields.hasErrors('stock')}"
            th:errors="*{stock}">
        </div>


        <!-- Price -->

        <label>
            Price
        </label>

        <input
            type="number"
            th:field="*{price}"
            min="0"
            step="0.01"
            required>

        <div
            class="error"
            th:if="${#fields.hasErrors('price')}"
            th:errors="*{price}">
        </div>


        <!-- Expiry Date -->

        <label>
            Expiry Date
        </label>

        <input
            type="date"
            th:field="*{expiryDate}"
            required>

        <div
            class="error"
            th:if="${#fields.hasErrors('expiryDate')}"
            th:errors="*{expiryDate}">
        </div>


        <!-- Save -->

        <button type="submit">
            Save Medicine
        </button>

    </form>


    <!-- Back -->

    <a
        href="/pharmacy"
        class="back-button">

        ← Back to Pharmacy

    </a>

</div>

</body>

</html>
