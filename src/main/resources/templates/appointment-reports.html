<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Appointment Reports</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 40px;
        }

        .container {
            width: 900px;
            margin: auto;
        }

        h1 {
            color: #1e3a5f;
        }

        .report-card {
            background-color: white;
            padding: 30px;
            margin-top: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .number {
            font-size: 40px;
            font-weight: bold;
            color: #1e3a5f;
            margin-top: 10px;
        }

        .back-button {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 20px;
            background-color: #555;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Appointment Reports</h1>

    <div class="report-card">

        <h2>Total Appointments</h2>

        <div class="number"
             th:text="${totalAppointments}">
            0
        </div>

        <p>
            Total number of appointments registered in the system.
        </p>

    </div>

    <a href="/reports"
       class="back-button">
        Back to Reports
    </a>

</div>

</body>

</html>
