<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Medical Records</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .back-button {
            display: inline-block;
            background-color: #1e3a5f;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .back-button:hover {
            background-color: #162d4a;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #333;
        }

        .add-button {
            background-color: #2563eb;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 5px;
        }

        .add-button:hover {
            background-color: #1d4ed8;
        }

        table {
            width: 100%;
            margin-top: 30px;
            background-color: white;
            border-collapse: collapse;
        }

        th {
            background-color: #2563eb;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        .action-button {
            display: inline-block;
            padding: 7px 12px;
            margin: 2px;
            border-radius: 4px;
            text-decoration: none;
            color: white;
        }

        .view-button {
            background-color: #16a34a;
        }

        .view-button:hover {
            background-color: #15803d;
        }

        .edit-button {
            background-color: #f59e0b;
        }

        .edit-button:hover {
            background-color: #d97706;
        }

        .delete-button {
            background-color: #dc2626;
        }

        .delete-button:hover {
            background-color: #b91c1c;
        }

    </style>

</head>

<body>

<!-- Back to Dashboard -->

<a href="/dashboard" class="back-button">
    🏠 Back to Dashboard
</a>


<div class="header">

    <h1>Medical Records</h1>

    <a
            href="/medical-records/add"
            class="add-button">

        ➕ Add Medical Record

    </a>

</div>


<table>

    <thead>

    <tr>

        <th>Patient</th>
        <th>Diagnosis</th>
        <th>Treatment</th>
        <th>Prescription</th>
        <th>Medical Report</th>
        <th>Date</th>
        <th>Actions</th>

    </tr>

    </thead>


    <tbody>

    <tr
            th:each="record : ${medicalRecords}">

        <!-- Patient -->

        <td th:text="${record.patientId}">
            Patient
        </td>


        <!-- Diagnosis -->

        <td th:text="${record.diagnosis}">
            Diagnosis
        </td>


        <!-- Treatment -->

        <td th:text="${record.treatment}">
            Treatment
        </td>


        <!-- Prescription -->

        <td th:text="${record.prescription}">
            Prescription
        </td>


        <!-- Medical Report -->

        <td th:text="${record.medicalReport}">
            Medical Report
        </td>


        <!-- Date -->

        <td th:text="${record.recordDate}">
            Date
        </td>


        <!-- Actions -->

        <td>

            <!-- View -->

            <a
                    th:href="@{/medical-records/view/{id}(id=${record.id})}"
                    class="action-button view-button">

                👁 View

            </a>


            <!-- Edit -->

            <a
                    th:href="@{/medical-records/edit/{id}(id=${record.id})}"
                    class="action-button edit-button">

                ✏ Edit

            </a>


            <!-- Delete -->

            <a
                    th:href="@{/medical-records/delete/{id}(id=${record.id})}"
                    class="action-button delete-button"
                    onclick="return confirm('Are you sure you want to delete this medical record?');">

                🗑 Delete

            </a>

        </td>

    </tr>


    <!-- No Records -->

    <tr th:if="${#lists.isEmpty(medicalRecords)}">

        <td colspan="7" style="text-align: center; padding: 20px;">

            No medical records found.

        </td>

    </tr>

    </tbody>

</table>

</body>

</html>
