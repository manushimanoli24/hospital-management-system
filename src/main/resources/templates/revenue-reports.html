<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Revenue Reports</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 40px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #1e3a5f;
        }

        .back-button {
            background-color: #555;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 5px;
        }

        .reports {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .charge-reports {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #555;
            font-size: 18px;
        }

        .amount {
            margin-top: 15px;
            font-size: 30px;
            font-weight: bold;
            color: #1e3a5f;
        }

        .section-title {
            margin-top: 30px;
            margin-bottom: 20px;
            color: #333;
        }

        @media (max-width: 768px) {

            .reports,
            .charge-reports {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<div class="container">


    <!-- Header -->

    <div class="header">

        <h1>Revenue Reports</h1>

        <a href="/reports"
           class="back-button">
            Back to Reports
        </a>

    </div>


    <!-- Main Revenue -->

    <div class="reports">


        <!-- Total Revenue -->

        <div class="card">

            <h2>Total Revenue</h2>

            <div class="amount">

                Rs.
                <span th:text="${totalRevenue}">
                    0.00
                </span>

            </div>

        </div>


        <!-- Paid Revenue -->

        <div class="card">

            <h2>Paid Revenue</h2>

            <div class="amount">

                Rs.
                <span th:text="${paidRevenue}">
                    0.00
                </span>

            </div>

        </div>


        <!-- Pending Revenue -->

        <div class="card">

            <h2>Pending Revenue</h2>

            <div class="amount">

                Rs.
                <span th:text="${pendingRevenue}">
                    0.00
                </span>

            </div>

        </div>


    </div>


    <!-- Revenue Breakdown -->

    <h2 class="section-title">
        Revenue Breakdown
    </h2>


    <div class="charge-reports">


        <!-- Consultation -->

        <div class="card">

            <h2>Consultation Revenue</h2>

            <div class="amount">

                Rs.
                <span th:text="${consultationRevenue}">
                    0.00
                </span>

            </div>

        </div>


        <!-- Laboratory -->

        <div class="card">

            <h2>Laboratory Revenue</h2>

            <div class="amount">

                Rs.
                <span th:text="${laboratoryRevenue}">
                    0.00
                </span>

            </div>

        </div>


        <!-- Pharmacy -->

        <div class="card">

            <h2>Pharmacy Revenue</h2>

            <div class="amount">

                Rs.
                <span th:text="${pharmacyRevenue}">
                    0.00
                </span>

            </div>

        </div>


        <!-- Admission -->

        <div class="card">

            <h2>Admission Revenue</h2>

            <div class="amount">

                Rs.
                <span th:text="${admissionRevenue}">
                    0.00
                </span>

            </div>

        </div>


    </div>


</div>

</body>

</html>
